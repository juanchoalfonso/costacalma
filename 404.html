<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Costa Calma</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Sunday';
            src: url('assets/fonts/sunday.ttf') format('truetype');
        }
        @font-face {
            font-family: 'TrueNorth';
            src: url('assets/fonts/true_north.otf') format('opentype');
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #141414;
            background-image: url('assets/images_instagram/SnapInsta.to_687604719_18009457283856068_4410676142675175983_n.webp');
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 160px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .num {
            font-family: 'Sunday', serif;
            font-size: clamp(6rem, 20vw, 10rem);
            color: rgba(255,255,255,0.12);
            line-height: 1;
            letter-spacing: -4px;
        }

        h1 {
            font-family: 'TrueNorth', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: white;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        p {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 1px;
            max-width: 360px;
            line-height: 1.6;
        }

        .btn-volver {
            margin-top: 10px;
            display: inline-block;
            padding: 14px 36px;
            background-color: #5E603B;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .btn-volver:hover {
            background-color: #4a4c2e;
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background-color: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.75);
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-wa:hover {
            border-color: white;
            color: white;
        }

        .btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="assets/images/logo_top_banner.png" alt="Costa Calma" class="logo">
        <div class="num">404</div>
        <h1>Página no encontrada</h1>
        <p>Parece que esta página se fue al río. Pero el complejo sigue esperándote.</p>
        <div class="btns">
            <a href="/" class="btn-volver">Volver al inicio</a>
            <a href="https://wa.me/5492323301372?text=Hola!%20Me%20gustaría%20consultar%20disponibilidad" class="btn-wa" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="18" height="18">
                Consultar
            </a>
        </div>
    </div>
</body>
</html>
